<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 950px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #1f3c88;
    }

    .subtitle {
      color: #555;
      margin-bottom: 24px;
    }

    .chat-box {
      border: 1px solid #d9e2ec;
      background: #f8fafc;
      border-radius: 12px;
      padding: 18px;
      min-height: 320px;
      max-height: 520px;
      overflow-y: auto;
      margin-bottom: 18px;
    }

    .message {
      margin-bottom: 14px;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .user-message {
      background-color: #dbeafe;
      border: 1px solid #bfdbfe;
    }

    .assistant-message {
      background-color: #eef2ff;
      border: 1px solid #c7d2fe;
    }

    .message-title {
      font-weight: bold;
      margin-bottom: 6px;
      color: #1f3c88;
    }

    .meta {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #d9e2ec;
      font-size: 14px;
    }

    .meta p {
      margin: 6px 0;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #cfd8e3;
      border-radius: 10px;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      margin-top: 16px;
      background-color: #1f3c88;
      color: white;
      border: none;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #16306f;
    }

    button:disabled {
      background-color: #8aa0d6;
      cursor: not-allowed;
    }


    .whatsapp-quick-button {
      background-color: #25D366;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 8px;
    }

    .whatsapp-quick-button:hover {
      background-color: #1ebe5d;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .hint {
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }

    a {
      color: #1f3c88;
      word-break: break-all;
    }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .model-selector label {
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }

    .model-selector select {
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      background: #f8fafc;
      color: #1f3c88;
      cursor: pointer;
      min-width: 180px;
    }

    .model-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .badge-granite {
      background: #E6F1FB;
      color: #0C447C;
    }

    .badge-qwen {
      background: #EAF3DE;
      color: #27500A;
    }

    .badge-fallback {
      background: #FBEAEA;
      color: #7C0C0C;
    }

    /* ── Loading Spinner ── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(31, 60, 136, 0.2);
      border-top-color: #1f3c88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .loading-dots {
      display: inline-block;
      width: 4px;
    }

    .loading-dots::after {
      content: '.';
      animation: dots 1.5s steps(3, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    button.loading {
      background: linear-gradient(135deg, #4a7fc4 0%, #1f3c88 100%);
      opacity: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s;
    }

    button.loading:hover {
      background: linear-gradient(135deg, #4a7fc4 0%, #1f3c88 100%);
      cursor: wait;
    }

    .loading-skeleton {
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(
        90deg,
        #eef2ff 0%,
        #dbeafe 50%,
        #eef2ff 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      min-height: 40px;
      margin-bottom: 10px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ARCO</h1>
    <p class="subtitle">Asistente para el Registro Civil y su Orientación</p>

    <div class="model-selector">
      <label for="modelSelect">Modelo:</label>
      <select id="modelSelect">
        <option value="granite">Granite-4.0-1B (IBM)</option>
        <option value="qwen">Qwen2.5-3B (Alibaba)</option>
      </select>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message assistant-message">
        <div class="message-title">ARCO</div>
        <div>Hola. Puedes preguntarme por trámites del Registro Civil, por ejemplo: “quiero sacar pasaporte”.</div>
      </div>
    </div>

    <textarea id="query" placeholder="Escribe tu consulta aquí"></textarea>
    <button id="askButton">Enviar</button>
    <button id="whatsappButton" type="button" class="whatsapp-quick-button">Continuar en WhatsApp</button>
    <p class="hint">Prueba luego una pregunta de seguimiento como: “¿y eso requiere clave única?”</p>
  </div>

  <script>
    const BENCHMARK_API = "http://127.0.0.1:8000";

    const askButton  = document.getElementById("askButton");
    const queryInput = document.getElementById("query");
    const modelSelect = document.getElementById("modelSelect");
    const chatBox    = document.getElementById("chatBox");

    const history = [];
    let currentContext = null;

    const MODEL_LABELS = {
      granite: "Granite-4.0-1B",
      qwen:    "Qwen2.5-3B",
    };

    const MODEL_BADGE_CLASS = {
      granite: "badge-granite",
      qwen:    "badge-qwen",
    };

    function addMessage(role, htmlContent) {
      const message = document.createElement("div");
      message.className = `message ${role === "user" ? "user-message" : "assistant-message"}`;

      const title = document.createElement("div");
      title.className = "message-title";
      title.textContent = role === "user" ? "Tú" : "ARCO";

      const content = document.createElement("div");
      content.innerHTML = htmlContent;

      message.appendChild(title);
      message.appendChild(content);
      chatBox.appendChild(message);
      chatBox.scrollTop = chatBox.scrollHeight;

      return message;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function buildAssistantHtml(data, modelKey) {
      const label      = data.fallback ? "Fallback" : (MODEL_LABELS[modelKey] || modelKey);
      const badgeClass = data.fallback ? "badge-fallback" : (MODEL_BADGE_CLASS[modelKey] || "");
      return `
        <div>${escapeHtml(data.respuesta || "No disponible")}</div>
        <div class="meta">
          <p><strong>Trámite:</strong> ${escapeHtml(data.tramite || "No disponible")}</p>
          <p><strong>Costo:</strong> ${escapeHtml(data.costo || "No disponible")}</p>
          <p><strong>Duración estimada:</strong> ${escapeHtml(data.duracion || "No especificada")}</p>
          <p><strong>Canal:</strong> ${escapeHtml(data.canal || "No disponible")}</p>
          <p><strong>Presencialidad:</strong> ${escapeHtml(data.presencialidad || "No disponible")}</p>
          <p><strong>ClaveÚnica:</strong> ${escapeHtml(data.requiere_clave_unica || "No disponible")}</p>
          <p><strong>Fuente:</strong> ${
            data.fuente
              ? `<a href="${data.fuente}" target="_blank">${data.fuente}</a>`
              : "No disponible"
          }</p>
          <p><strong>Modelo:</strong> <span class="model-badge ${badgeClass}">${label}</span></p>
        </div>
      `;
    }

    function callBenchmark(modelKey, query) {
      return fetch(`${BENCHMARK_API}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query:    query,
          model:    modelKey,
          history:  history,
          context:  currentContext,
        }),
      });
    }

    async function sendQuery() {
      const query = queryInput.value.trim();

      if (!query) {
        addMessage("assistant", "<span class='error'>Debes escribir una consulta.</span>");
        return;
      }

      const selectedModel = modelSelect.value;
      const otherModel    = selectedModel === "granite" ? "qwen" : "granite";

      addMessage("user", escapeHtml(query));
      queryInput.value  = "";
      askButton.disabled = true;
      askButton.classList.add("loading");

      // Show loading message with spinner
      const loadingMessage = addMessage("assistant", `
        <div class="loading-text">
          <span class="spinner"></span>
          Consultando a ARCO<span class="loading-dots"></span>
        </div>
      `);

      try {
        // Dispara ambos modelos en paralelo (el segundo, sin bloquear, para benchmark)
        const selectedPromise = callBenchmark(selectedModel, query);
        const otherPromise    = callBenchmark(otherModel, query).catch(() => null);

        const selectedResult = await selectedPromise;

        if (!selectedResult.ok) {
          throw new Error("No se pudo obtener respuesta del backend.");
        }

        let data       = await selectedResult.json();
        let actualModel = selectedModel;

        // Si el modelo elegido no respondió realmente, usa la respuesta del otro
        // modelo si este sí funcionó, en vez del texto de respaldo por defecto.
        if (data.fallback) {
          const otherResult = await otherPromise;
          if (otherResult && otherResult.ok) {
            const otherData = await otherResult.json();
            if (!otherData.fallback) {
              data        = otherData;
              actualModel = otherModel;
            }
          }
        }

        loadingMessage.innerHTML = `
          <div class="message-title">ARCO</div>
          ${buildAssistantHtml(data, actualModel)}
        `;

        history.push({ role: "user",      content: query });
        history.push({ role: "assistant", content: data.respuesta || "" });

        if (data.tramite && data.tramite !== "No identificado") {
          currentContext = {
            tramite:              data.tramite,
            respuesta_base:       data.respuesta_base || null,
            costo:                data.costo || null,
            duracion:             data.duracion || null,
            canal:                data.canal || null,
            presencialidad:       data.presencialidad || null,
            requiere_clave_unica: data.requiere_clave_unica || null,
            fuente:               data.fuente || null,
          };
        }
      } catch (error) {
        loadingMessage.innerHTML = `
          <div class="message-title">ARCO</div>
          <div class="error">Hubo un error al conectar con el backend (puerto 8000).</div>
        `;
      } finally {
        askButton.disabled = false;
        askButton.classList.remove("loading");
      }
    }

    askButton.addEventListener("click", sendQuery);

    queryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuery();
      }
    });
  </script>

  <script>
    (function () {
      const WHATSAPP_NUMBER = "15556429941";
      const whatsappButton = document.getElementById("whatsappButton");
      const queryInput = document.getElementById("query");
      const askButton = document.getElementById("askButton");
      const chatBox = document.getElementById("chat");

      let lastQuery = "";

      function rememberQuery() {
        const value = queryInput && queryInput.value ? queryInput.value.trim() : "";
        if (value) {
          lastQuery = value;
        }
      }

      function getLastUserMessage() {
        if (!chatBox) return "";
        const users = chatBox.querySelectorAll(".message.user, .user");
        if (!users.length) return "";

        const raw = users[users.length - 1].innerText || "";
        const lines = raw
          .split(/\n/)
          .map(line => line.trim())
          .filter(Boolean);

        if (lines.length > 1 && lines[0].toLowerCase().startsWith("tu")) {
          lines.shift();
        }

        return lines.join(" ").trim();
      }

      if (askButton) {
        askButton.addEventListener("click", rememberQuery, true);
      }

      if (queryInput) {
        queryInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            rememberQuery();
          }
        }, true);
      }

      if (whatsappButton) {
        whatsappButton.addEventListener("click", function () {
          const currentQuery = queryInput && queryInput.value ? queryInput.value.trim() : "";
          const text = currentQuery || lastQuery || getLastUserMessage() || "quiero consultar un tramite";
          const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
          window.open(url, "_blank", "noopener,noreferrer");
        });
      }
    })();
  </script>

</body>
</html>
