<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 950px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #1f3c88;
    }

    .subtitle {
      color: #555;
      margin-bottom: 24px;
    }

    .chat-box {
      border: 1px solid #d9e2ec;
      background: #f8fafc;
      border-radius: 12px;
      padding: 18px;
      min-height: 320px;
      max-height: 520px;
      overflow-y: auto;
      margin-bottom: 18px;
    }

    .message {
      margin-bottom: 14px;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .user-message {
      background-color: #dbeafe;
      border: 1px solid #bfdbfe;
    }

    .assistant-message {
      background-color: #eef2ff;
      border: 1px solid #c7d2fe;
    }

    .message-title {
      font-weight: bold;
      margin-bottom: 6px;
      color: #1f3c88;
    }

    .meta {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #d9e2ec;
      font-size: 14px;
    }

    .meta p {
      margin: 6px 0;
    }

    .plan-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .plan-step {
      background: white;
      border: 1px solid #c7d2fe;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .plan-step-title {
      font-weight: bold;
      color: #1f3c88;
      margin-bottom: 6px;
    }

    .plan-step p {
      margin: 4px 0;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #cfd8e3;
      border-radius: 10px;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      margin-top: 16px;
      background-color: #1f3c88;
      color: white;
      border: none;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #16306f;
    }

    button:disabled {
      background-color: #8aa0d6;
      cursor: not-allowed;
    }


    .whatsapp-quick-button {
      background-color: #25D366;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 8px;
    }

    .whatsapp-quick-button:hover {
      background-color: #1ebe5d;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .hint {
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }

    a {
      color: #1f3c88;
      word-break: break-all;
    }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .model-selector label {
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }

    .model-selector select {
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      background: #f8fafc;
      color: #1f3c88;
      cursor: pointer;
      min-width: 180px;
    }

    .model-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .badge-granite {
      background: #E6F1FB;
      color: #0C447C;
    }

    .badge-qwen {
      background: #EAF3DE;
      color: #27500A;
    }

    .badge-fallback {
      background: #FBEAEA;
      color: #7C0C0C;
    }

    /* ── Loading Spinner ── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(31, 60, 136, 0.2);
      border-top-color: #1f3c88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .loading-dots {
      display: inline-block;
      width: 4px;
    }

    .loading-dots::after {
      content: '.';
      animation: dots 1.5s steps(3, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    button.loading {
      background: linear-gradient(135deg, #4a7fc4 0%, #1f3c88 100%);
      opacity: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s;
    }

    button.loading:hover {
      background: linear-gradient(135deg, #4a7fc4 0%, #1f3c88 100%);
      cursor: wait;
    }

    .loading-skeleton {
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(
        90deg,
        #eef2ff 0%,
        #dbeafe 50%,
        #eef2ff 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      min-height: 40px;
      margin-bottom: 10px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .feedback-btns {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #d9e2ec;
    }

    .fb-btn {
      padding: 4px 12px;
      border: 1px solid #cfd8e3;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      background: white;
      color: black;
    }

    .fb-btn:hover {
      background: #f4f7fb;
    }

    .fb-btn.selected-pos {
      background: #dcfce7;
      border-color: #166534;
      color: #166534;
    }

    .fb-btn.selected-neg {
      background: #fee2e2;
      border-color: #991b1b;
      color: #991b1b;
    }

    .plan-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .plan-step {
      background: white;
      border: 1px solid #c7d2fe;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .plan-step-title {
      font-weight: bold;
      color: #1f3c88;
      margin-bottom: 6px;
    }
    .plan-step p {
      margin: 4px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ARCO</h1>
    <p class="subtitle">Asistente para el Registro Civil y su Orientación</p>

    <div class="model-selector">
      <span id="modelLabel">Modelo: cargando…</span>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message assistant-message">
        <div class="message-title">ARCO</div>
        <div>Hola. Puedes preguntarme por trámites del Registro Civil, por ejemplo: “quiero sacar pasaporte”.</div>
      </div>
    </div>

    <textarea id="query" placeholder="Escribe tu consulta aquí"></textarea>
    <button id="askButton">Enviar</button>
    <button id="whatsappButton" type="button" class="whatsapp-quick-button">Continuar en WhatsApp</button>
    <p class="hint">Prueba luego una pregunta de seguimiento como: “¿y eso requiere clave única?”</p>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    const askButton  = document.getElementById("askButton");
    const queryInput = document.getElementById("query");
    const modelLabelEl = document.getElementById("modelLabel");
    const chatBox    = document.getElementById("chatBox");

    const history = [];
    let currentContext = null;

    fetch(`${API}/models`)
      .then(r => r.json())
      .then(data => {
        modelLabelEl.textContent = `Modelo: ${data.label || "desconocido"}`;
      })
      .catch(() => {
        modelLabelEl.textContent = "Modelo: no se pudo conectar con el backend";
      });

    function addMessage(role, htmlContent) {
      const message = document.createElement("div");
      message.className = `message ${role === "user" ? "user-message" : "assistant-message"}`;

      const title = document.createElement("div");
      title.className = "message-title";
      title.textContent = role === "user" ? "Tú" : "ARCO";

      const content = document.createElement("div");
      content.innerHTML = htmlContent;

      message.appendChild(title);
      message.appendChild(content);
      chatBox.appendChild(message);
      chatBox.scrollTop = chatBox.scrollHeight;

      return message;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function buildSingleItemHtml(data) {
      const label      = data.fallback ? "Fallback" : (data.model_used || "ARCO");
      const badgeClass = data.fallback
        ? "badge-fallback"
        : (data.model_used && data.model_used.toLowerCase().includes("qwen") ? "badge-qwen" : "badge-granite");
      const perf = data.fallback
        ? ""
        : `<p><strong>Tiempo de respuesta:</strong> ${data.latency_ms ?? "—"} ms` +
          (data.ttft_ms != null ? ` (primer token: ${data.ttft_ms} ms)` : "") +
          `</p>`;
      return `
        <div>${escapeHtml(data.respuesta || "No disponible")}</div>
        <div class="meta">
          <p><strong>Trámite:</strong> ${escapeHtml(data.tramite || "No disponible")}</p>
          <p><strong>Costo:</strong> ${escapeHtml(data.costo || "No disponible")}</p>
          <p><strong>Duración estimada:</strong> ${escapeHtml(data.duracion || "No especificada")}</p>
          <p><strong>Canal:</strong> ${escapeHtml(data.canal || "No disponible")}</p>
          <p><strong>Presencialidad:</strong> ${escapeHtml(data.presencialidad || "No disponible")}</p>
          <p><strong>ClaveÚnica:</strong> ${escapeHtml(data.requiere_clave_unica || "No disponible")}</p>
          <p><strong>Fuente:</strong> ${
            data.fuente
              ? `<a href="${data.fuente}" target="_blank">${data.fuente}</a>`
              : "No disponible"
          }</p>
          ${perf}
          <p><strong>Modelo:</strong> <span class="model-badge ${badgeClass}">${label}</span></p>
        </div>
      `;
    }

    function buildFeedbackHtml(traceId) {
      if (!traceId) return "";
      return `
        <div class="feedback-btns" data-trace-id="${traceId}">
          <span style="font-size:12px;color:#555;align-self:center">¿Te sirvió esta respuesta?</span>
          <button class="fb-btn" onclick="sendFeedback('${traceId}', 1.0, this)">👍 Útil</button>
          <button class="fb-btn" onclick="sendFeedback('${traceId}', 0.5, this)">🤔 Neutral</button>
          <button class="fb-btn" onclick="sendFeedback('${traceId}', 0.0, this)">👎 No útil</button>
        </div>
      `;
    }

    async function sendFeedback(traceId, score, btn) {
      try {
        await fetch(`${API}/feedback`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ trace_id: traceId, score }),
        });
        const container = btn.closest(".feedback-btns");
        container.querySelectorAll(".fb-btn").forEach(b => b.classList.remove("selected-pos", "selected-neg"));
        const cls = score >= 0.8 ? "selected-pos" : score <= 0.2 ? "selected-neg" : null;
        if (cls) btn.classList.add(cls);
        if (!container.querySelector(".fb-thanks")) {
          container.insertAdjacentHTML("beforeend", `<span class="fb-thanks">¡Gracias por tu feedback!</span>`);
        }
      } catch (error) {
        console.error("No se pudo enviar el feedback", error);
      }
    }

    function callAsk(query) {
      return fetch(`${API}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query:    query,
          history:  history,
          context:  currentContext,
        }),
      });
    }

    function buildStepCard(step, tituloPrefijo) {
      const descripcion = step.respuesta || step.respuesta_base || "";
      return `
        <div class="plan-step">
          <div class="plan-step-title">${escapeHtml(tituloPrefijo)}${escapeHtml(step.tramite || "")}</div>
          ${descripcion ? `<p>${escapeHtml(descripcion)}</p>` : ""}
          <p><strong>Costo:</strong> ${escapeHtml(step.costo || "No disponible")}</p>
          <p><strong>Presencialidad:</strong> ${escapeHtml(step.presencialidad || "No disponible")}</p>
          <p><strong>ClaveÚnica:</strong> ${escapeHtml(step.requiere_clave_unica || "No disponible")}</p>
          <p><strong>Fuente:</strong> ${
            step.fuente
              ? `<a href="${step.fuente}" target="_blank">${step.fuente}</a>`
              : "No disponible"
          }</p>
        </div>
      `;
    }

    function buildPlanHtml(data) {
      const introTexto = data.intro || "Aquí tienes el plan de trámites que necesitas seguir:";
      let html = `<div>${escapeHtml(introTexto)}</div>`;

      if (Array.isArray(data.plan) && data.plan.length > 0) {
        html += `<div class="plan-list">`;
        data.plan.forEach((step) => {
          html += buildStepCard(step, `Paso ${step.orden}: `);
        });
        html += `</div>`;
      }

      return html;
    }

    function buildIndependientesHtml(data) {
      if (!Array.isArray(data.consultas) || data.consultas.length === 0) {
        return `<div>${escapeHtml(data.respuesta || "No disponible")}</div>`;
      }

      let html = `<div class="plan-list">`;
      data.consultas.forEach((consulta) => {
        html += buildStepCard(consulta, "");
      });
      html += `</div>`;

      return html;
    }

    function buildAssistantHtml(data) {
      let html = "";
      if (data.modo === "plan") {
        html = buildPlanHtml(data);
      } else if (data.modo === "consultas_independientes") {
        html = buildIndependientesHtml(data);
      } else {
        html = buildSingleItemHtml(data);
      }
      return html + buildFeedbackHtml(data.trace_id);
    }

    async function sendQuery() {
      const query = queryInput.value.trim();

      if (!query) {
        addMessage("assistant", "<span class='error'>Debes escribir una consulta.</span>");
        return;
      }

      addMessage("user", escapeHtml(query));
      queryInput.value  = "";
      askButton.disabled = true;
      askButton.classList.add("loading");

      // Show loading message with spinner
      const loadingMessage = addMessage("assistant", `
        <div class="loading-text">
          <span class="spinner"></span>
          Consultando a ARCO<span class="loading-dots"></span>
        </div>
      `);

      try {
        const result = await callAsk(query);

        if (!result.ok) {
          throw new Error("No se pudo obtener respuesta del backend.");
        }

        const data = await result.json();

        loadingMessage.innerHTML = `
          <div class="message-title">ARCO</div>
          ${buildAssistantHtml(data)}
        `;

        history.push({ role: "user",      content: query });
        history.push({ role: "assistant", content: data.respuesta || "" });

        if (data.tramite && data.tramite !== "No identificado" && !data.modo) {
          currentContext = {
            tramite:              data.tramite,
            respuesta_base:       data.respuesta_base || null,
            costo:                data.costo || null,
            duracion:             data.duracion || null,
            canal:                data.canal || null,
            presencialidad:       data.presencialidad || null,
            requiere_clave_unica: data.requiere_clave_unica || null,
            fuente:               data.fuente || null,
          };
        }
      } catch (error) {
        loadingMessage.innerHTML = `
          <div class="message-title">ARCO</div>
          <div class="error">Hubo un error al conectar con el backend (puerto 8000).</div>
        `;
      } finally {
        askButton.disabled = false;
        askButton.classList.remove("loading");
      }
    }

    askButton.addEventListener("click", sendQuery);

    queryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuery();
      }
    });
  </script>

  <script>
    (function () {
      const WHATSAPP_NUMBER = "15556429941";
      const whatsappButton = document.getElementById("whatsappButton");
      const queryInput = document.getElementById("query");
      const askButton = document.getElementById("askButton");
      const chatBox = document.getElementById("chat");

      let lastQuery = "";

      function rememberQuery() {
        const value = queryInput && queryInput.value ? queryInput.value.trim() : "";
        if (value) {
          lastQuery = value;
        }
      }

      function getLastUserMessage() {
        if (!chatBox) return "";
        const users = chatBox.querySelectorAll(".message.user, .user");
        if (!users.length) return "";

        const raw = users[users.length - 1].innerText || "";
        const lines = raw
          .split(/\n/)
          .map(line => line.trim())
          .filter(Boolean);

        if (lines.length > 1 && lines[0].toLowerCase().startsWith("tu")) {
          lines.shift();
        }

        return lines.join(" ").trim();
      }

      if (askButton) {
        askButton.addEventListener("click", rememberQuery, true);
      }

      if (queryInput) {
        queryInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            rememberQuery();
          }
        }, true);
      }

      if (whatsappButton) {
        whatsappButton.addEventListener("click", function () {
          const currentQuery = queryInput && queryInput.value ? queryInput.value.trim() : "";
          const text = currentQuery || lastQuery || getLastUserMessage() || "quiero consultar un tramite";
          const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
          window.open(url, "_blank", "noopener,noreferrer");
        });
      }
    })();
  </script>

</body>
</html>
